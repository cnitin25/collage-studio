<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach under the notch / home
         indicator; .app pads itself back with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Browser/status-bar colour; App.tsx keeps it in step with the theme. -->
    <meta name="theme-color" content="#181b22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Collage" />

    <title>Collage Studio - Offline Photo Collage Editor</title>
    <meta name="description" content="Collage Studio is a free, offline-first photo collage editor that runs entirely in your browser. Arrange, resize, rotate, and export photo collages — your photos never leave your device." />
    <meta name="keywords" content="photo collage maker, offline collage editor, browser photo editor, privacy-friendly collage app" />

    <!-- Open Graph: how the link looks when shared on social/chat apps -->
    <meta property="og:title" content="Collage Studio - Offline Photo Collage Editor" />
    <meta property="og:description" content="Free, offline-first photo collage editor. Everything runs client-side — your photos never leave your device." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://collage.thenewai.icu/" />
    <meta property="og:image" content="https://collage.thenewai.icu/icon-512.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Collage Studio - Offline Photo Collage Editor" />
    <meta name="twitter:description" content="Free, offline-first photo collage editor. Your photos never leave your device." />
    <meta name="twitter:image" content="https://collage.thenewai.icu/icon-512.png" />

    <link rel="canonical" href="https://collage.thenewai.icu/" />

    <!-- Favicon / touch icons using your existing PWA icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS wants 180×180 and opaque: transparent corners render black. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
